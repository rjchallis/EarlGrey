name: CI

on:
    push:
        branches: [main]
    pull_request:

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    rust-checks:
        name: Rust checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust stable with rustfmt + clippy
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: cargo fmt --check
              run: cargo fmt --all -- --check

            - name: cargo clippy (deny warnings)
              run: cargo clippy --all-targets -- -D warnings

            - name: cargo test
              run: cargo test
              env:
                  PROPTEST_CASES: 512

    python-checks:
        name: Python checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install formatting and type-checking tools
              run: pip install black isort pyright pytest "hypothesis[cli]" pyyaml

            - name: black --check
              run: black --check --line-length 120 python/ tests/python/

            - name: isort --check
              run: isort --check-only --profile black --line-length 120 python/ tests/python/

            - name: pyright
              run: pyright python/ tests/python/

    integration-tests:
        name: Build and test (maturin + pytest)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Create virtualenv
              run: python -m venv .venv && echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

            - name: Install Python test dependencies
              run: pip install maturin pytest "hypothesis[cli]" pyyaml

            - name: maturin develop
              run: maturin develop --features extension-module

            - name: pytest
              run: pytest tests/python/ -v
              env:
                  CI: "1"
