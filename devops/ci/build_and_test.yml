name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/gh-action-rust-toolchain@v1
        with:
          profile: minimal
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Build Rust workspace
        run: cargo build --workspace --verbose
      - name: Run basic Rust tests
        run: cargo test --workspace --no-run || true
      - name: Build Python bindings (maturin)
        run: |
          python -m pip install --upgrade pip maturin
          cd crates/earlgrey-bindings && maturin build --release
